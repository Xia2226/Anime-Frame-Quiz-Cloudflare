<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#4f6df5" />
    <title>网站管理后台</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./admin.css" />
    <link rel="stylesheet" href="./dropdown.css" />
  </head>
  <body>
    <div class="adminShell">
      <header class="adminHeader">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>网站管理后台</h1>
        </div>
      </header>

      <nav class="adminNav" aria-label="后台模块">
        <button type="button" class="navItem active" data-module="feedback">问题反馈</button>
        <button type="button" class="navItem" data-module="anime">动漫管理</button>
        <button type="button" class="navItem" data-module="announcements">公告管理</button>
        <button type="button" class="navItem" data-module="leaderboard">排行榜</button>
        <button type="button" class="navItem" data-module="analytics">访问统计</button>
      </nav>

      <main>
        <section id="module-feedback" class="modulePanel">
          <div class="moduleHead">
            <h2>问题反馈</h2>
            <button id="refreshButton" class="btn primary" type="button">刷新</button>
          </div>
          <div class="toolbar">
            <div class="toolbarFilters">
              <label class="filterLabel" for="typeFilter">
                反馈类型
                <select id="typeFilter" data-afq-select>
                  <option value="">全部</option>
                  <option value="anime_error">番剧错误</option>
                  <option value="bug">BUG 反馈</option>
                  <option value="feature">项目功能</option>
                  <option value="other">其他</option>
                </select>
              </label>
              <label class="filterLabel" for="statusFilter">
                状态
                <select id="statusFilter" data-afq-select>
                  <option value="">全部</option>
                  <option value="unhandled" selected>未处理</option>
                  <option value="handled">已处理</option>
                </select>
              </label>
            </div>
            <p id="totalLabel" class="totalLabel" role="status"></p>
          </div>
          <p id="statusMessage" class="status" role="status"></p>
          <section id="listSection" class="listSection" aria-live="polite"></section>
          <footer class="pagination">
            <button id="prevButton" class="btn" type="button">上一页</button>
            <span id="pageInfo" class="pageInfo"></span>
            <button id="nextButton" class="btn" type="button">下一页</button>
          </footer>
        </section>

        <section id="module-announcements" class="modulePanel hidden">
          <div class="moduleHead">
            <h2>公告管理</h2>
            <button id="annRefreshButton" class="btn primary" type="button">刷新</button>
          </div>
          <div class="anaBlock">
            <p class="blockTitle" id="annFormTitle">发布公告</p>
            <form id="annForm" class="annForm">
              <label class="annField" for="annTitle">
                标题
                <input id="annTitle" type="text" maxlength="80" required autocomplete="off" placeholder="公告标题（1–80 字）" />
              </label>
              <label class="annField" for="annContent">
                正文
                <textarea id="annContent" rows="4" maxlength="2000" required placeholder="公告正文（1–2000 字，可换行）"></textarea>
              </label>
              <div class="annFormRow">
                <label class="annCheck">
                  <input id="annPinned" type="checkbox" />
                  <span>置顶展示</span>
                </label>
                <p id="annMessage" class="annMessage" role="status"></p>
              </div>
              <div class="annFormActions">
                <button id="annCancelEditButton" class="btn hidden" type="button">取消编辑</button>
                <button id="annResetButton" class="btn" type="button">清空</button>
                <button id="annSubmitButton" class="btn primary" type="submit">发布</button>
              </div>
            </form>
          </div>
          <div class="toolbar">
            <label class="filterLabel" for="annStatusFilter">
              状态
              <select id="annStatusFilter" data-afq-select>
                <option value="">全部</option>
                <option value="active">已上架</option>
                <option value="inactive">已下架</option>
              </select>
            </label>
            <p id="annTotalLabel" class="totalLabel" role="status"></p>
          </div>
          <p id="annStatus" class="status" role="status"></p>
          <div class="tableWrap">
            <table class="dataTable" id="annTable">
              <thead>
                <tr>
                  <th>标题</th>
                  <th>置顶</th>
                  <th>状态</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <footer class="pagination">
            <button id="annPrevButton" class="btn" type="button">上一页</button>
            <span id="annPageInfo" class="pageInfo"></span>
            <button id="annNextButton" class="btn" type="button">下一页</button>
          </footer>
        </section>

        <section id="module-leaderboard" class="modulePanel hidden">
          <div class="moduleHead">
            <h2>排行榜</h2>
            <button id="lbRefreshButton" class="btn primary" type="button">刷新</button>
          </div>
          <div class="anaBlock">
            <div class="blockHead">
              <p class="blockTitle" id="lbDetailTitle">榜单明细</p>
              <div class="lbControls">
                <label class="filterLabel" for="lbModeFilter">
                  模式
                  <select id="lbModeFilter" data-afq-select>
                    <option value="classic">经典模式</option>
                    <option value="hard">困难挑战</option>
                  </select>
                </label>
                <label class="filterLabel" for="lbDaySelect">
                  日期
                  <select id="lbDaySelect" data-afq-select></select>
                </label>
                <p id="lbStatus" class="totalLabel" role="status"></p>
              </div>
            </div>
            <div class="tableWrap">
              <table class="dataTable" id="lbDetailTable">
                <thead>
                  <tr>
                    <th>排名</th>
                    <th>用户</th>
                    <th>得分</th>
                    <th>答对/题数</th>
                    <th>正确率</th>
                    <th>用时</th>
                    <th>提交时间</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="anaBlock">
            <p class="blockTitle">近 14 天提交概览</p>
            <div class="tableWrap">
              <table class="dataTable" id="lbDaysTable">
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>经典模式</th>
                    <th>困难挑战</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>

        <section id="module-anime" class="modulePanel hidden">
          <div class="moduleHead">
            <h2>动漫管理</h2>
            <button id="animeRefreshButton" class="btn primary" type="button">刷新</button>
          </div>
          <div class="toolbar">
            <label class="filterLabel" for="animeSearch">
              搜索
              <input id="animeSearch" type="search" placeholder="标题 / 原名 / 番剧 ID" autocomplete="off" />
              <button id="animeResetButton" class="btn" type="button">重置</button>
            </label>
            <label class="filterLabel" for="animeStatusFilter">
              状态
              <select id="animeStatusFilter" data-afq-select>
                <option value="">全部</option>
                <option value="enabled">已启用</option>
                <option value="disabled">已停用</option>
              </select>
            </label>
            <p id="animeTotalLabel" class="totalLabel" role="status"></p>
          </div>
          <p id="animeStatus" class="status" role="status"></p>
          <div class="tableWrap">
            <table class="dataTable" id="animeTable">
              <thead>
                <tr>
                  <th>番剧</th>
                  <th>首播</th>
                  <th>评分</th>
                  <th>截图</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <footer class="pagination">
            <button id="animePrevButton" class="btn" type="button">上一页</button>
            <span id="animePageInfo" class="pageInfo"></span>
            <button id="animeNextButton" class="btn" type="button">下一页</button>
          </footer>
        </section>

        <section id="module-analytics" class="modulePanel hidden">
          <div class="moduleHead">
            <h2>访问统计</h2>
            <label class="filterLabel" for="anaDaysSelect">
              时间范围
              <select id="anaDaysSelect" data-afq-select>
                <option value="1">当日</option>
                <option value="7" selected>近 7 天</option>
                <option value="30">近 30 天</option>
                <option value="90">近 90 天</option>
                <option value="0">全部</option>
              </select>
            </label>
          </div>
          <div class="statCards">
            <div class="statCard">
              <span id="anaTotalVisitors" class="statValue">-</span>
              <small>总访客量</small>
            </div>
            <div class="statCard">
              <span id="anaTotalPlays" class="statValue">-</span>
              <div class="statSubRow">
                <small>游玩次数</small>
                <p id="anaPlaysByMode" class="statSub" role="status">（经典 0 · 困难 0 · 自由 0）</p>
              </div>
            </div>
          </div>
          <p id="anaStatus" class="totalLabel" role="status"></p>
          <div class="anaBlock">
            <p class="blockTitle">每日访问趋势</p>
            <div class="tableWrap">
              <table class="dataTable" id="anaDailyTable">
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>访客量</th>
                    <th>游玩次数</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="anaBlock">
            <div class="blockHead">
              <p class="blockTitle">网站游玩日志</p>
              <div class="playLogMeta">
                <label class="filterLabel" for="anaPlayModeSelect">
                  模式
                  <select id="anaPlayModeSelect" data-afq-select>
                    <option value="all" selected>全部</option>
                    <option value="classic">经典模式</option>
                    <option value="hard">困难挑战</option>
                    <option value="free">自由练习</option>
                  </select>
                </label>
                <button type="button" id="anaPlayReset" class="btn" disabled>重置</button>
                <p id="anaPlayLogCount" class="totalLabel" role="status"></p>
              </div>
            </div>
            <div class="tableWrap">
              <table class="dataTable" id="anaPlayLogTable">
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>模式</th>
                    <th>用户</th>
                    <th>得分</th>
                    <th>答对/题数</th>
                    <th>正确率</th>
                    <th>用时</th>
                    <th>状态</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div id="annDetailModal" class="annDetailModal hidden">
      <div class="annDetailDialog" role="dialog" aria-modal="true" aria-label="公告详情">
        <div id="annDetailBody" class="announcementDetail"></div>
      </div>
    </div>
    <script src="./admin.js"></script>
    <script type="module" src="./js/dropdown.js"></script>
  </body>
</html>
